[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "java2bedrock"
version = "1.0.0"
description = "Universal Minecraft Java (1.14 - 26.3+) to Bedrock (.mcpack) & GeyserMC Converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
